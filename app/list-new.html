<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New List — We Eat</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/app.css">
  <style>

    /* ════════════════════════════════════════════════════════
       PAGE
    ════════════════════════════════════════════════════════ */

    .order-form-page {
      padding-block: var(--space-8) var(--space-20);
    }

    /* ── Page header row ────────────────────────────────── */

    .form-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-8);
    }

    .form-page-title {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .form-page-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    /* ════════════════════════════════════════════════════════
       INTRO: IMAGE (left) + TITLE / DESCRIPTION (right)
    ════════════════════════════════════════════════════════ */

    .form-intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-12);
      align-items: start;
      margin-bottom: var(--space-12);
    }

    @media (max-width: 900px) {
      .form-intro { grid-template-columns: 1fr; gap: var(--space-8); }
    }

    /* ── Upload phases ──────────────────────────────────── */

    .upload-square {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--color-bg-subtle);
      overflow: hidden;
    }

    .upload-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      border: 2px dashed var(--color-border-strong);
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }
    .upload-placeholder:hover {
      border-color: var(--color-black);
      background: var(--color-bg-subtle);
    }
    .upload-placeholder svg {
      width: 28px;
      height: 28px;
      color: var(--color-text-muted);
    }
    .upload-placeholder__label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    #image-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Phase: crop */
    .crop-phase { position: relative; }

    .crop-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
      user-select: none;
    }

    #source-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .crop-overlay { position: absolute; inset: 0; pointer-events: none; }

    .crop-shade {
      position: absolute;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .crop-box {
      position: absolute;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      cursor: move;
      pointer-events: all;
      box-sizing: border-box;
    }

    .crop-rule { position: absolute; background: rgba(255,255,255,0.2); pointer-events: none; }
    .crop-rule--v1 { left: 33.33%; top: 0; bottom: 0; width: 1px; }
    .crop-rule--v2 { left: 66.66%; top: 0; bottom: 0; width: 1px; }
    .crop-rule--h1 { top: 33.33%; left: 0; right: 0; height: 1px; }
    .crop-rule--h2 { top: 66.66%; left: 0; right: 0; height: 1px; }

    .crop-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.25);
      pointer-events: all;
    }
    .crop-handle--tl { top: -7px;    left: -7px;  cursor: nwse-resize; }
    .crop-handle--tr { top: -7px;    right: -7px; cursor: nesw-resize; }
    .crop-handle--bl { bottom: -7px; left: -7px;  cursor: nesw-resize; }
    .crop-handle--br { bottom: -7px; right: -7px; cursor: nwse-resize; }

    .crop-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0 0;
    }

    .crop-aspect-tag {
      flex: 1;
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* Phase: result */
    .result-phase { position: relative; }

    .result-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    #crop-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .recrop-btn {
      position: absolute;
      bottom: var(--space-3);
      right: var(--space-3);
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-wider);
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      font-family: var(--font-primary);
      transition: background var(--transition-fast);
    }
    .recrop-btn:hover { background: rgba(0, 0, 0, 0.85); }
    .recrop-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

    /* ════════════════════════════════════════════════════════
       SHARED FORM STYLES
    ════════════════════════════════════════════════════════ */

    .form-basics {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .form-field { margin-bottom: var(--space-5); }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }

    .form-input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-2) 0;
      font-family: var(--font-primary);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-regular);
      color: var(--color-text-primary);
      background: transparent;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-input:focus { border-bottom-color: var(--color-black); }
    .form-input::placeholder { color: var(--color-text-muted); }

    .form-textarea {
      resize: none;
      min-height: 80px;
      line-height: var(--line-height-relaxed);
    }

    /* ════════════════════════════════════════════════════════
       ORDER LIST BUILDER
    ════════════════════════════════════════════════════════ */

    .list-builder { margin-top: var(--space-4); }

    .section-label {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
      padding-bottom: var(--space-4);
      border-bottom: 2px solid var(--color-black);
      margin-bottom: var(--space-6);
    }

    /* ── Order search ────────────────────────────────────── */

    .order-search-wrap {
      position: relative;
      margin-bottom: var(--space-6);
    }

    .order-search-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    .order-search-icon {
      position: absolute;
      left: 0;
      width: 14px;
      height: 14px;
      color: var(--color-text-muted);
      pointer-events: none;
      flex-shrink: 0;
    }

    #order-search {
      padding-left: 22px;
    }

    .order-search-dropdown {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      background: var(--color-white);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-elevated);
      max-height: 360px;
      overflow-y: auto;
      z-index: 50;
      scrollbar-width: thin;
      scrollbar-color: var(--color-border) transparent;
    }

    .order-search-result {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      text-align: left;
      padding: var(--space-3) var(--space-4);
      font-family: var(--font-primary);
      background: none;
      border: none;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .order-search-result:last-child { border-bottom: none; }
    .order-search-result:hover { background: var(--color-bg-subtle); }
    .order-search-result.is-added {
      opacity: 0.4;
      pointer-events: none;
    }

    .order-search-result__thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--color-bg-subtle);
    }

    .order-search-result__info {
      flex: 1;
      min-width: 0;
    }

    .order-search-result__restaurant {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-tight);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .order-search-result__meta {
      display: block;
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .order-search-result__added-tag {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .order-search-empty {
      padding: var(--space-4);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      text-align: center;
    }

    /* ── Added order cards ───────────────────────────────── */

    .list-orders-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .list-order-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      transition: border-color var(--transition-fast);
      cursor: grab;
    }
    .list-order-card:hover {
      border-color: var(--color-border-strong);
    }

    .list-order-card__drag {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-text-muted);
      cursor: grab;
    }
    .list-order-card__drag svg {
      width: 14px;
      height: 14px;
    }

    .list-order-card__thumb {
      width: 52px;
      height: 52px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--color-bg-subtle);
    }

    .list-order-card__info {
      flex: 1;
      min-width: 0;
    }

    .list-order-card__restaurant {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-tight);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-order-card__meta {
      display: block;
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .list-order-card__number {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-muted);
      flex-shrink: 0;
      min-width: 20px;
      text-align: center;
    }

    /* Remove button */
    .remove-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      color: var(--color-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .remove-btn:hover { color: var(--color-error); }
    .remove-btn svg { width: 14px; height: 14px; }

    /* ── Empty state ─────────────────────────────────────── */

    .list-empty-state {
      text-align: center;
      padding: var(--space-10) var(--space-4);
      color: var(--color-text-muted);
    }

    .list-empty-state svg {
      width: 32px;
      height: 32px;
      margin-bottom: var(--space-3);
      color: var(--color-border-strong);
    }

    .list-empty-state__text {
      font-size: var(--font-size-xs);
      letter-spacing: var(--letter-spacing-wide);
    }

    /* ── Order count ─────────────────────────────────────── */

    .list-count-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) 0;
      border-top: 1px solid var(--color-border);
      margin-top: var(--space-2);
    }

    .list-count-label {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .list-count-value {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      min-width: 60px;
      text-align: right;
    }

    /* ── Form footer ────────────────────────────────────── */

    .form-footer {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-top: var(--space-16);
      padding-top: var(--space-8);
      border-top: 1px solid var(--color-border);
    }

    /* ── Drag-and-drop ───────────────────────────────────── */

    .list-order-card.is-dragging {
      opacity: 0.4;
    }

    .list-order-card.drag-over-above {
      border-top: 2px solid var(--color-black);
    }

    .list-order-card.drag-over-below {
      border-bottom: 2px solid var(--color-black);
    }

  </style>
</head>

  <!-- ═══════════════════════════════════════════════════════
       APP BODY
  ═══════════════════════════════════════════════════════ -->
  <div class="app-body">
    <div class="page-container order-form-page">
      <form id="list-form" novalidate>

        <!-- Page header -->
        <div class="form-page-header">
          <span class="form-page-title">New List</span>
          <div class="form-page-actions">
            <a href="profile.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Post List</button>
          </div>
        </div>


        <!-- ══════════════════════════════════════════════
             SECTION 1: COVER IMAGE + TITLE / DESCRIPTION
        ═══════════════════════════════════════════════ -->
        <div class="form-intro">

          <!-- Left: cover photo upload / crop / result -->
          <div class="upload-col">

            <!-- Phase A: empty placeholder -->
            <div id="phase-upload">
              <div class="upload-square">
                <input type="file" id="image-input" accept="image/*" aria-label="Upload cover photo">
                <div class="upload-placeholder" id="upload-placeholder">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                  <span class="upload-placeholder__label">Cover Photo</span>
                </div>
              </div>
            </div>

            <!-- Phase B: crop UI -->
            <div id="phase-crop" hidden>
              <div class="crop-phase">
                <div class="crop-container" id="crop-container">
                  <img id="source-img" alt="">
                  <div class="crop-overlay">
                    <div class="crop-shade" id="shade-top"></div>
                    <div class="crop-shade" id="shade-bottom"></div>
                    <div class="crop-shade" id="shade-left"></div>
                    <div class="crop-shade" id="shade-right"></div>
                    <div class="crop-box" id="crop-box">
                      <div class="crop-rule crop-rule--v1"></div>
                      <div class="crop-rule crop-rule--v2"></div>
                      <div class="crop-rule crop-rule--h1"></div>
                      <div class="crop-rule crop-rule--h2"></div>
                      <div class="crop-handle crop-handle--tl" data-handle="tl"></div>
                      <div class="crop-handle crop-handle--tr" data-handle="tr"></div>
                      <div class="crop-handle crop-handle--bl" data-handle="bl"></div>
                      <div class="crop-handle crop-handle--br" data-handle="br"></div>
                    </div>
                  </div>
                </div>
                <div class="crop-actions">
                  <span class="crop-aspect-tag">1:1 Crop</span>
                  <button type="button" class="btn btn-secondary" id="change-photo-btn">Change Photo</button>
                  <button type="button" class="btn btn-primary" id="apply-crop-btn">Apply Crop</button>
                </div>
              </div>
            </div>

            <!-- Phase C: cropped result -->
            <div id="phase-result" hidden>
              <div class="result-phase">

  <script src="../js/app.js"></script>
  <script>

    /* ════════════════════════════════════════════════════════
       SHARED ICON STRINGS
    ════════════════════════════════════════════════════════ */
    const ICON_REMOVE = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
    const ICON_DRAG   = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 6h.01M12 6h.01M8 12h.01M12 12h.01M8 18h.01M12 18h.01"/></svg>`;


    /* ════════════════════════════════════════════════════════
       IMAGE UPLOAD + CROP
    ════════════════════════════════════════════════════════ */
    const imageInput     = document.getElementById('image-input');
    const phaseUpload    = document.getElementById('phase-upload');
    const phaseCrop      = document.getElementById('phase-crop');
    const phaseResult    = document.getElementById('phase-result');
    const sourceImg      = document.getElementById('source-img');
    const cropContainer  = document.getElementById('crop-container');
    const cropBox        = document.getElementById('crop-box');
    const cropCanvas     = document.getElementById('crop-canvas');

    let cX = 0, cY = 0, cS = 100;
    const MIN_CROP_PX = 40;

    function showPhase(phase) {
      phaseUpload.hidden = true;
      phaseCrop.hidden   = true;
      phaseResult.hidden = true;
      phase.hidden       = false;
    }

    document.getElementById('upload-placeholder').addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      sourceImg.onload = () => {
        showPhase(phaseCrop);
        requestAnimationFrame(initCrop);
      };
      sourceImg.src = url;
    });

    function initCrop() {
      const cw = cropContainer.offsetWidth;
      const ch = cropContainer.offsetHeight;
      const iw = sourceImg.naturalWidth;
      const ih = sourceImg.naturalHeight;
      const imgRatio  = iw / ih;
      const contRatio = cw / ch;

      let rw, rh, ox, oy;
      if (imgRatio > contRatio) {
        rw = cw; rh = cw / imgRatio;
        ox = 0;  oy = (ch - rh) / 2;
      } else {
        rh = ch; rw = ch * imgRatio;
        ox = (cw - rw) / 2; oy = 0;
      }

      cS = Math.min(rw, rh);
      cX = ox + (rw - cS) / 2;
      cY = oy + (rh - cS) / 2;
      redrawCrop();
    }

    function redrawCrop() {
      const cw = cropContainer.offsetWidth;
      const ch = cropContainer.offsetHeight;

      cS = Math.max(MIN_CROP_PX, cS);
      cX = Math.max(0, Math.min(cw - cS, cX));
      cY = Math.max(0, Math.min(ch - cS, cY));

      cropBox.style.left   = cX + 'px';
      cropBox.style.top    = cY + 'px';
      cropBox.style.width  = cS + 'px';
      cropBox.style.height = cS + 'px';

      const st = document.getElementById('shade-top');
      const sb = document.getElementById('shade-bottom');
      const sl = document.getElementById('shade-left');
      const sr = document.getElementById('shade-right');

      st.style.cssText = `top:0; left:0; right:0; height:${cY}px;`;
      sb.style.cssText = `top:${cY + cS}px; left:0; right:0; bottom:0;`;
      sl.style.cssText = `top:${cY}px; left:0; width:${cX}px; height:${cS}px;`;
      sr.style.cssText = `top:${cY}px; left:${cX + cS}px; right:0; height:${cS}px;`;
    }

    let drag = null;

    function pointerPos(e) {
      const rect = cropContainer.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    cropBox.addEventListener('mousedown', e => {
      if (e.target.classList.contains('crop-handle')) return;
      e.preventDefault();
      const p = pointerPos(e);
      drag = { type: 'move', sx: p.x, sy: p.y, scX: cX, scY: cY };
    });

    cropBox.querySelectorAll('.crop-handle').forEach(h => {
      h.addEventListener('mousedown', e => {
        e.preventDefault();
        e.stopPropagation();
        const p = pointerPos(e);
        drag = { type: 'resize', handle: h.dataset.handle, sx: p.x, sy: p.y, scX: cX, scY: cY, scS: cS };
      });
    });

    document.addEventListener('mousemove', e => {
      if (!drag) return;
      const p  = pointerPos(e);
      const cw = cropContainer.offsetWidth;
      const ch = cropContainer.offsetHeight;

      if (drag.type === 'move') {
        cX = drag.scX + (p.x - drag.sx);
        cY = drag.scY + (p.y - drag.sy);
      } else {
        const { handle, scX, scY, scS } = drag;
        const brX = scX + scS, brY = scY + scS;
        const trX = scX + scS, trY = scY;
        const blX = scX,       blY = scY + scS;

        if (handle === 'br') {
          const ns = Math.max(MIN_CROP_PX, Math.min(p.x - scX, p.y - scY, cw - scX, ch - scY));
          cS = ns; cX = scX; cY = scY;
        } else if (handle === 'tl') {
          const ns = Math.max(MIN_CROP_PX, Math.min(brX - p.x, brY - p.y, brX, brY));
          cS = ns; cX = brX - ns; cY = brY - ns;
        } else if (handle === 'tr') {
          const ns = Math.max(MIN_CROP_PX, Math.min(p.x - blX, blY - p.y, cw - blX, blY));
          cS = ns; cX = blX; cY = blY - ns;
        } else if (handle === 'bl') {
          const ns = Math.max(MIN_CROP_PX, Math.min(trX - p.x, p.y - trY, trX, ch - trY));
          cS = ns; cX = trX - ns; cY = trY;
        }
      }
      redrawCrop();
    });

    document.addEventListener('mouseup', () => { drag = null; });

    document.getElementById('apply-crop-btn').addEventListener('click', () => {
      const cw = cropContainer.offsetWidth;
      const ch = cropContainer.offsetHeight;
      const iw = sourceImg.naturalWidth;
      const ih = sourceImg.naturalHeight;
      const imgRatio  = iw / ih;
      const contRatio = cw / ch;

      let rw, rh, ox, oy;
      if (imgRatio > contRatio) {
        rw = cw; rh = cw / imgRatio;
        ox = 0;  oy = (ch - rh) / 2;
      } else {
        rh = ch; rw = ch * imgRatio;
        ox = (cw - rw) / 2; oy = 0;
      }

      const sx = ((cX - ox) / rw) * iw;
      const sy = ((cY - oy) / rh) * ih;
      const sw = (cS / rw) * iw;
      const sh = (cS / rh) * ih;

      const OUT = 800;
      cropCanvas.width  = OUT;
      cropCanvas.height = OUT;
      cropCanvas.getContext('2d').drawImage(sourceImg, sx, sy, sw, sh, 0, 0, OUT, OUT);

      showPhase(phaseResult);
    });

    document.getElementById('recrop-btn').addEventListener('click', () => showPhase(phaseCrop));

    document.getElementById('change-photo-btn').addEventListener('click', () => {
      imageInput.value = '';
      showPhase(phaseUpload);
    });


    /* ════════════════════════════════════════════════════════
       DEMO ORDER DATA
    ════════════════════════════════════════════════════════ */
    const DEMO_ORDERS = [
      { id: 'o1',  restaurant: 'Nobu',                    date: 'Jun 24, 2026', rating: 5, items: 3, thumb: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=200&q=80' },
      { id: 'o2',  restaurant: 'Din Tai Fung',            date: 'Jun 20, 2026', rating: 5, items: 4, thumb: 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=200&q=80' },
      { id: 'o3',  restaurant: 'Shake Shack',             date: 'Jun 18, 2026', rating: 4, items: 3, thumb: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=200&q=80' },
      { id: 'o4',  restaurant: 'Chipotle Mexican Grill',  date: 'Jun 15, 2026', rating: 4, items: 2, thumb: 'https://images.unsplash.com/photo-1599974579688-8dbdd335c77f?auto=format&fit=crop&w=200&q=80' },
      { id: 'o5',  restaurant: 'Cheesecake Factory',      date: 'Jun 12, 2026', rating: 3, items: 5, thumb: 'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=200&q=80' },
      { id: 'o6',  restaurant: 'In-N-Out Burger',         date: 'Jun 10, 2026', rating: 5, items: 3, thumb: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=200&q=80' },
      { id: 'o7',  restaurant: 'Olive Garden',            date: 'Jun 7, 2026',  rating: 3, items: 4, thumb: 'https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?auto=format&fit=crop&w=200&q=80' },
      { id: 'o8',  restaurant: 'Le Bernardin',            date: 'Jun 3, 2026',  rating: 5, items: 6, thumb: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=200&q=80' },
      { id: 'o9',  restaurant: 'Raising Cane\'s',         date: 'May 28, 2026', rating: 4, items: 2, thumb: 'https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=200&q=80' },
      { id: 'o10', restaurant: 'P.F. Chang\'s',           date: 'May 24, 2026', rating: 4, items: 5, thumb: 'https://images.unsplash.com/photo-1617093727343-374698b1b08d?auto=format&fit=crop&w=200&q=80' },
      { id: 'o11', restaurant: 'Eleven Madison Park',     date: 'May 20, 2026', rating: 5, items: 8, thumb: 'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=200&q=80' },
      { id: 'o12', restaurant: 'Panda Express',           date: 'May 15, 2026', rating: 3, items: 3, thumb: 'https://images.unsplash.com/photo-1525755662778-989d0524087e?auto=format&fit=crop&w=200&q=80' },
    ];

    const addedOrderIds = new Set();

    function ratingStars(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }


    /* ════════════════════════════════════════════════════════
       ORDER SEARCH
    ════════════════════════════════════════════════════════ */
    const orderSearchInput = document.getElementById('order-search');
    const orderDropdown    = document.getElementById('order-dropdown');

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderOrderDropdown(query) {
      const q = query.trim().toLowerCase();
      const matches = q
        ? DEMO_ORDERS.filter(o => o.restaurant.toLowerCase().includes(q)).slice(0, 6)
        : DEMO_ORDERS.slice(0, 6);

      if (!matches.length) {
        orderDropdown.innerHTML = `<div class="order-search-empty">No orders found</div>`;
      } else {
        orderDropdown.innerHTML = matches.map(o => {
          const isAdded = addedOrderIds.has(o.id);
          let label = escapeHtml(o.restaurant);
          if (q) {
            const i = o.restaurant.toLowerCase().indexOf(q);
            if (i >= 0) {
              label = escapeHtml(o.restaurant.slice(0, i))
                + '<mark>' + escapeHtml(o.restaurant.slice(i, i + q.length)) + '</mark>'
                + escapeHtml(o.restaurant.slice(i + q.length));
            }
          }
          return `
            <button type="button" class="order-search-result${isAdded ? ' is-added' : ''}" data-id="${o.id}">
              <img class="order-search-result__thumb" src="${o.thumb}" alt="${escapeHtml(o.restaurant)}">
              <div class="order-search-result__info">
                <span class="order-search-result__restaurant">${label}</span>
                <span class="order-search-result__meta">${o.date} &middot; ${ratingStars(o.rating)} &middot; ${o.items} items</span>
              </div>
              ${isAdded ? '<span class="order-search-result__added-tag">Added</span>' : ''}
            </button>`;
        }).join('');

        orderDropdown.querySelectorAll('.order-search-result:not(.is-added)').forEach(btn => {
          btn.addEventListener('click', () => {
            const order = DEMO_ORDERS.find(o => o.id === btn.dataset.id);
            if (order) addOrder(order);
          });
        });
      }
      orderDropdown.hidden = false;
    }

    orderSearchInput.addEventListener('input', () => renderOrderDropdown(orderSearchInput.value));
    orderSearchInput.addEventListener('focus', () => renderOrderDropdown(orderSearchInput.value));

    document.addEventListener('click', e => {
      if (!e.target.closest('.order-search-wrap')) orderDropdown.hidden = true;
    });


    /* ════════════════════════════════════════════════════════
       ADD / REMOVE ORDERS
    ════════════════════════════════════════════════════════ */
    const listContainer = document.getElementById('list-orders-container');
    const emptyState    = document.getElementById('list-empty-state');
    const countRow      = document.getElementById('list-count-row');
    const countValue    = document.getElementById('list-count-value');

    function addOrder(order) {
      addedOrderIds.add(order.id);

      const card = document.createElement('div');
      card.className = 'list-order-card';
      card.dataset.id = order.id;
      card.draggable = true;

      card.innerHTML = `
        <span class="list-order-card__number">${addedOrderIds.size}</span>
        <div class="list-order-card__drag" aria-label="Drag to reorder">${ICON_DRAG}</div>
        <img class="list-order-card__thumb" src="${order.thumb}" alt="${escapeHtml(order.restaurant)}">
        <div class="list-order-card__info">
          <span class="list-order-card__restaurant">${escapeHtml(order.restaurant)}</span>
          <span class="list-order-card__meta">${order.date} &middot; ${ratingStars(order.rating)} &middot; ${order.items} items</span>
        </div>
        <button type="button" class="remove-btn" title="Remove order">${ICON_REMOVE}</button>
      `;

      card.querySelector('.remove-btn').addEventListener('click', () => removeOrder(card, order.id));
      wireDrag(card);

      listContainer.appendChild(card);
      updateListState();

      orderSearchInput.value = '';
      orderDropdown.hidden = true;
    }

    function removeOrder(card, orderId) {
      addedOrderIds.delete(orderId);
      card.remove();
      renumberCards();
      updateListState();
    }

    function updateListState() {
      const count = listContainer.children.length;
      emptyState.hidden = count > 0;
      countRow.hidden   = count === 0;
      countValue.textContent = count;
    }

    function renumberCards() {
      listContainer.querySelectorAll('.list-order-card').forEach((card, i) => {
        card.querySelector('.list-order-card__number').textContent = i + 1;
      });
    }


    /* ════════════════════════════════════════════════════════
       DRAG & DROP REORDER
    ════════════════════════════════════════════════════════ */
    let dragCard = null;

    function wireDrag(card) {
      card.addEventListener('dragstart', e => {
        dragCard = card;
        card.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('is-dragging');
        clearDragStyles();
        dragCard = null;
        renumberCards();
      });

      card.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (!dragCard || dragCard === card) return;

        clearDragStyles();
        const rect = card.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        if (e.clientY < midY) {
          card.classList.add('drag-over-above');
        } else {
          card.classList.add('drag-over-below');
        }
      });

      card.addEventListener('dragleave', () => {
        card.classList.remove('drag-over-above', 'drag-over-below');
      });

      card.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragCard || dragCard === card) return;

        const rect = card.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        if (e.clientY < midY) {
          listContainer.insertBefore(dragCard, card);
        } else {
          listContainer.insertBefore(dragCard, card.nextSibling);
        }

        clearDragStyles();
        renumberCards();
      });
    }

    function clearDragStyles() {
      listContainer.querySelectorAll('.list-order-card').forEach(c => {
        c.classList.remove('drag-over-above', 'drag-over-below');
      });
    }

  </script>
